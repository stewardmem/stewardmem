[package]
name = "presage-store-sqlite"
version = "0.8.0-dev"
edition = "2024"
license = "AGPL-3.0-only"

[features]
default = ["libsqlite3-sys/bundled-sqlcipher"]
cdsi = ["presage/cdsi", "libsqlite3-sys/bundled-sqlcipher-custom-crypto"]

[dependencies]
presage = { git = "https://github.com/whisperfish/presage", rev = "6f630791b2c7bf3d5b00c75f5a6c94131bf79c8c", default-features = false }

async-trait = "0.1.83"
bytes = "1.9.0"
chrono = "0.4.38"
prost = "0.14.4"
serde_json = "1.0.135"
sqlx = { version = "0.9.0", features = [
    "json",
    "sqlite",
    "uuid",
    "runtime-tokio",
] }
thiserror = "2.0.0"
tracing = "0.1.41"
uuid = "1.12.0"

# Explicitly use the libsqlite3-sys crate with the bundled-sqlcipher feature
libsqlite3-sys = { version = "0.40.0", features = [] }

[dev-dependencies]
tokio = { version = "1.48.0", features = ["rt", "macros"] }
rand = "0.9"

# The version pin IS this dependency's purpose: the [patch] override's whole
# point is forcing the patched libsqlite3-sys resolution (RUSTSEC-2026-0459/
# 0502), and no source import exists — the unused-dependency watchdog would
# otherwise read the pin as dead. Machete's own documented escape hatch.
[package.metadata.cargo-machete]
ignored = ["libsqlite3-sys"]
