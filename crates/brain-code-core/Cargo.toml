[package]
name = "brain-code-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The code-index substrate core: the per-repo SQLite index (schema, tree-sitter ingest, symbol chunks, lexical and vector tables) behind an encoder port the kernel fills. The crate loads no model and makes no network call. C0: nothing consumes the index yet."
publish = false

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11"
# At the workspace's existing pins (P-3). sqlite-vec itself is NOT named here:
# loading a SQLite extension is an FFI act and this crate forbids unsafe
# outright (§R2). The FFI shim lives in brain-code-vec0; production fills the
# Vec0Host port with the kernel's own registration.
rusqlite = { version = "0.41.1", features = ["bundled"] }

[dev-dependencies]
brain-code-vec0 = { path = "../brain-code-vec0" }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
